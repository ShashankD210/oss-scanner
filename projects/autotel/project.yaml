# autotel is an OpenTelemetry toolkit for Node, edge and browser (~15k npm downloads a month). It
# captures request data into telemetry, applies redaction before export, parses incoming trace
# context, and ships OTLP receivers with web UIs and an MCP server, so attacker-controlled request
# data and network input reach its parsers, redaction and renderers.
