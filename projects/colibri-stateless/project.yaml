# Colibri Stateless: a prover/verifier for Ethereum (and OP-Stack L2) RPC data.
# The core is portable C with bindings for JavaScript/TypeScript, Python,
# Kotlin/Java, Swift, Dart, and Rust, used by wallets and embedded clients to
# cryptographically verify RPC responses without running a full node.
#
# Dockerfile and threat_model live in the project repository under .oss-scanner/
# so they can be updated without a new pull request here.
