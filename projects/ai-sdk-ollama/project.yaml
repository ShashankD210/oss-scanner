# ai-sdk-ollama is the Vercel AI SDK provider for Ollama (~300k npm downloads a month). It parses
# and repairs model output into tool calls and typed objects, maps responses from local or remote
# Ollama servers, and carries API keys, so prompt-injected model output and hostile server replies
# reach its parsers directly.
